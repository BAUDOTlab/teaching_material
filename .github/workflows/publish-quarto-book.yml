# Render Quarto to ./docs then deploy as static files (no Jekyll build of ./docs).
#
# GitHub repo → Settings → Pages:
#   Build and deployment → Source: "GitHub Actions"
#
# Do NOT use "Deploy from a branch" → /docs unless you commit ./docs to git.
# Do NOT use the default "Jekyll" starter workflow (it expects ./docs in the checkout).

name: Quarto Publish Book for best practices with Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 17 * * 5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      # Quarto still needs Rscript even though chapters are Markdown-only:
      # `_quarto.yml` sets `format.html.code-link: true`, which post-processes
      # code blocks via the knitr/downlit path
      # (https://quarto.org/docs/output-formats/html-code.html).
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages for Quarto code-link
        shell: Rscript {0}
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Bootstrap pak (binary builds; avoids compiling pak itself)
          install.packages(
            "pak",
            repos = sprintf(
              "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
              .Platform$pkgType,
              R.Version()$os,
              R.Version()$arch
            )
          )

          pkgs <- c("rmarkdown", "downlit", "xml2")

          # Resolve and install all missing OS libraries in one go
          sr <- pak::pkg_sysreqs(pkgs)
          print(sr)
          cmds <- c(sr$pre_install, sr$install_scripts, sr$post_install)
          cmds <- cmds[nzchar(cmds)]
          if (length(cmds)) {
            status <- system2(
              "sudo",
              c(
                "env", "DEBIAN_FRONTEND=noninteractive",
                "bash", "-lc", paste(cmds, collapse = " && ")
              )
            )
            if (!identical(as.integer(status), 0L)) {
              stop("System dependency installation via pak::pkg_sysreqs() failed")
            }
          }

          pak::pkg_install(pkgs)
          stopifnot(all(vapply(
            pkgs,
            requireNamespace,
            quietly = TRUE,
            FUN.VALUE = logical(1)
          )))

      - name: Render book (HTML + PDF)
        run: quarto render
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
