# Render Quarto to ./docs then deploy as static files (no Jekyll build of ./docs).
#
# GitHub repo → Settings → Pages:
#   Build and deployment → Source: "GitHub Actions"
#
# Do NOT use "Deploy from a branch" → /docs unless you commit ./docs to git.
# Do NOT use the default "Jekyll" starter workflow (it expects ./docs in the checkout).

name: Quarto Publish Book for best practices with Linux

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 17 * * 5"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true

      # Quarto still needs Rscript even though chapters are Markdown-only:
      # `_quarto.yml` sets `format.html.code-link: true`, which post-processes
      # code blocks via the knitr/downlit path
      # (https://quarto.org/docs/output-formats/html-code.html).
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Posit/r-lib action: resolves sysreqs + R packages via pak in one go
      # https://github.com/r-lib/actions/tree/v2-branch/setup-r-dependencies
      - name: Install R packages for Quarto code-link
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # No package DESCRIPTION in this repo — install only what code-link needs
          packages: any::rmarkdown, any::downlit, any::xml2
          cache-version: 1

      # Mermaid → PNG for PDF hangs for hours if no Chrome/Edge is present
      # https://quarto.org/docs/authoring/diagrams.html
      - name: Install Chrome Headless Shell
        run: quarto install chrome-headless-shell --no-prompt

      - name: Render book (HTML + PDF)
        run: quarto render

      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
